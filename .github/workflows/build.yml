name: CI

on:
  # push:
  #   branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          sudo chown -R $(whoami):staff /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Cache Bazel Disk Cache
        uses: actions/cache@v4
        with:
          path: /Users/Shared/telegram-bazel-cache
          key: bazel-disk-cache-${{ runner.os }}-${{ hashFiles('versions.json', 'WORKSPACE') }}-${{ github.run_id }}
          restore-keys: |
            bazel-disk-cache-${{ runner.os }}-${{ hashFiles('versions.json', 'WORKSPACE') }}-
            bazel-disk-cache-${{ runner.os }}-

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          CACHE_DIR="/Users/Shared/telegram-bazel-cache"
          mkdir -p "$CACHE_DIR"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$CACHE_DIR" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # Prune disk cache if it exceeds ~8GB to stay safely within GitHub's 10GB limit
          if [ -d "$CACHE_DIR" ]; then
            CACHE_SIZE_MB=$(du -sm "$CACHE_DIR" 2>/dev/null | cut -f1)
            echo "Bazel disk cache size: ${CACHE_SIZE_MB}MB"
            if [ -n "$CACHE_SIZE_MB" ] && [ "$CACHE_SIZE_MB" -gt 8000 ]; then
              echo "Pruning disk cache to stay within GitHub limit..."
              find "$CACHE_DIR" -type f -print0 | xargs -0 ls -lt | tail -n +5000 | awk '{print $NF}' | xargs rm -f 2>/dev/null || true
            fi
          fi

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          if [ -f "bazel-bin/Telegram/Swiftgram.ipa" ]; then
            cp "bazel-bin/Telegram/Swiftgram.ipa" "$OUTPUT_PATH/DoxGram.ipa"
            cp "bazel-bin/Telegram/Swiftgram.ipa" "$OUTPUT_PATH/Swiftgram.ipa"
            cp "bazel-bin/Telegram/Swiftgram.ipa" "$OUTPUT_PATH/Telegram.ipa"
          elif [ -f "bazel-bin/Telegram/Telegram.ipa" ]; then
            cp "bazel-bin/Telegram/Telegram.ipa" "$OUTPUT_PATH/DoxGram.ipa"
            cp "bazel-bin/Telegram/Telegram.ipa" "$OUTPUT_PATH/Swiftgram.ipa"
            cp "bazel-bin/Telegram/Telegram.ipa" "$OUTPUT_PATH/Telegram.ipa"
          else
            IPA_PATH=$(find bazel-bin -name "*.ipa" | head -n 1)
            if [ -n "$IPA_PATH" ]; then
              cp "$IPA_PATH" "$OUTPUT_PATH/DoxGram.ipa"
              cp "$IPA_PATH" "$OUTPUT_PATH/Swiftgram.ipa"
              cp "$IPA_PATH" "$OUTPUT_PATH/Telegram.ipa"
            else
              echo "ERROR: No IPA found in bazel-bin"
              find bazel-bin -maxdepth 3 -print
              exit 1
            fi
          fi

          # collect dsym
          mkdir -p build/DSYMs
          for f in bazel-bin/Telegram/*.dSYM; do
            if [ -d "$f" ]; then
              cp -R "$f" build/DSYMs/
            fi
          done
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null
          cp "./$OUTPUT_PATH/Telegram.DSYMs.zip" "./$OUTPUT_PATH/Swiftgram.DSYMs.zip" 2>/dev/null || true
          cp "./$OUTPUT_PATH/Telegram.DSYMs.zip" "./$OUTPUT_PATH/DoxGram.DSYMs.zip" 2>/dev/null || true

      - name: Upload Artifacts Backup
        uses: actions/upload-artifact@v4
        with:
          name: DoxGram-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/DoxGram.ipa
          retention-days: 14

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="build-${{ env.BUILD_NUMBER }}"
          TITLE="DoxGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})"
          NOTES="An unsigned build of DoxGram for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})"
          ARTIFACTS_DIR="/Users/Shared/telegram-ios/build/artifacts"
          IPA_FILE="$ARTIFACTS_DIR/DoxGram.ipa"

          if [ ! -f "$IPA_FILE" ]; then
            echo "ERROR: $IPA_FILE does not exist!"
            exit 1
          fi

          echo "Found IPA: $(ls -lh "$IPA_FILE")"

          # 1. Try atomic create with IPA if release does not exist yet
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating release $TAG with DoxGram.ipa..."
            if gh release create "$TAG" "$IPA_FILE" --title "$TITLE" --notes "$NOTES"; then
              echo "Release $TAG created and DoxGram.ipa uploaded successfully!"
              exit 0
            fi
            echo "Atomic create returned an error, waiting for release propagation..."
            sleep 5
          fi

          # 2. Upload DoxGram.ipa with retry loop (handles GitHub upload API 500 errors / eventual consistency)
          MAX_RETRIES=5
          RETRY_DELAY=5
          UPLOADED=0

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Uploading DoxGram.ipa (Attempt $i/$MAX_RETRIES)..."
            if gh release upload "$TAG" "$IPA_FILE" --clobber; then
              echo "Successfully uploaded DoxGram.ipa to release $TAG!"
              UPLOADED=1
              break
            fi
            echo "Upload attempt $i failed with error, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
            RETRY_DELAY=$((RETRY_DELAY * 2))
          done

          if [ "$UPLOADED" -eq 0 ]; then
            echo "::warning::GitHub Releases upload endpoint returned 500 after $MAX_RETRIES attempts. DoxGram.ipa is safely available in the Actions Artifacts tab above."
          fi
